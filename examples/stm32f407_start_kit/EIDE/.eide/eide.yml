version: "4.1"
name: stm32f407_start_kit
type: ARM
deviceName: STM32F407ZGTx
packDir: ""
srcDirs:
  - ../app
  - ../bsp
  - ../port
  - ../../..
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: Application
      files: []
      folders:
        - name: MDK-ARM
          files:
            - path: ../MDK-ARM/startup_stm32f407xx.s
          folders: []
        - name: User
          files: []
          folders:
            - name: Core
              files:
                - path: ../Core/Src/main.c
                - path: ../Core/Src/gpio.c
                - path: ../Core/Src/dma.c
                - path: ../Core/Src/iwdg.c
                - path: ../Core/Src/usart.c
                - path: ../Core/Src/stm32f4xx_it.c
                - path: ../Core/Src/stm32f4xx_hal_msp.c
                - path: ../Core/Src/retarget.c
              folders: []
    - name: Drivers
      files: []
      folders:
        - name: STM32F4xx_HAL_Driver
          files:
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_cortex.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_dma.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_dma_ex.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_exti.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_flash.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_flash_ex.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_flash_ramfunc.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_gpio.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_iwdg.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_pwr.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_pwr_ex.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_rcc.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_rcc_ex.c
            - path: ../Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_uart.c
          folders: []
        - name: CMSIS
          files:
            - path: ../Core/Src/system_stm32f4xx.c
          folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: ""
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F407xx
      incList:
        - ../Core/Inc
        - ../Drivers/STM32F4xx_HAL_Driver/Inc
        - ../Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - ../Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - ../Drivers/CMSIS/Include
        - ../app
        - ../bsp
        - ../../..
        - ../port
      libList: []
    excludeList:
      - ../../../examples
    settings:
      debugger: cortex-debug
    toolchain: AC6
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-auto
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: -fno-exceptions -fno-rtti
            language-c: c99
            language-cpp: c++17
            one-elf-section-per-function: true
            optimization: level-2
            plain-char-is-signed: true
            warnings: ac5-like-warnings
          global:
            output-debug-info: enable
          linker:
            misc-controls: --diag_suppress=L6329
            output-format: elf
        scatterFilePath: ""
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x20000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x100000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: STM32F407ZG
          vendor: STMicroelectronics
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/stm32f407_start_kit.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: STLink
